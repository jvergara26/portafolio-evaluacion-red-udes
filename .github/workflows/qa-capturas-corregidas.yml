name: Auditoria visual del Word corregido UDES
on:
  push:
    paths:
      - .github/workflows/qa-capturas-corregidas.yml
jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preparar conversión
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils python3-pil
          python -m pip install --quiet python-docx Pillow
      - name: Comprobar capturas y composición del Word
        run: |
          mkdir -p /tmp/qa
          libreoffice -env:UserInstallation=file:///tmp/qa/lo --headless --convert-to pdf --outdir /tmp/qa entregas/Documento_Evidencias_Portafolio_UDES_Corregido.docx
          pdfinfo /tmp/qa/Documento_Evidencias_Portafolio_UDES_Corregido.pdf | grep -E 'Pages:|Page size:'
          pdftoppm -jpeg -r 36 /tmp/qa/Documento_Evidencias_Portafolio_UDES_Corregido.pdf /tmp/qa/page >/dev/null 2>&1
          python - <<'PY'
          import base64,io,glob,os
          from PIL import Image,ImageDraw
          from docx import Document
          p='entregas/Documento_Evidencias_Portafolio_UDES_Corregido.docx'
          d=Document(p)
          media=[Image.open(io.BytesIO(rel.target_part.blob)).convert('RGB') for rel in d.part.rels.values() if 'image' in rel.reltype]
          print('VERIFICACION_MEDIA='+str(len(media)))
          if len(media)!=26:raise RuntimeError('No hay 26 figuras')
          # Una lámina de todas las páginas del documento en miniatura.
          files=sorted(glob.glob('/tmp/qa/page-*.jpg'))
          print('NUMERO_PAGINAS='+str(len(files)))
          columns=5; w=204; h=270; rows=(len(files)+columns-1)//columns
          sheet=Image.new('RGB',(columns*w,rows*h),'#e3e8e3');draw=ImageDraw.Draw(sheet)
          for i,f in enumerate(files):
              im=Image.open(f).convert('RGB');im.thumbnail((w-14,h-30))
              x=(i%columns)*w+(w-im.width)//2;y=(i//columns)*h+8
              sheet.paste(im,(x,y))
              draw.text(((i%columns)*w+8,(i//columns)*h+h-19),f'Hoja {i+1}',fill='#263d2e')
          buf=io.BytesIO();sheet.save(buf,format='JPEG',quality=68,optimize=True)
          print('PAGINACION_MOSAICO='+base64.b64encode(buf.getvalue()).decode())
          # Figuras representativas, agrupadas para revisar cada sección.
          groups=[('inicio',0,2),('modelos',2,9),('seleccion',9,12),('red',12,15),('rediseno',15,19),('aplicacion',19,23),('referencias',23,26)]
          for name,start,end in groups:
              imgs=media[start:end]
              width=880;cellheight=370
              rows=(len(imgs)+1)//2
              m=Image.new('RGB',(2*width,rows*cellheight),'#e2e6e4')
              draw=ImageDraw.Draw(m)
              for j,im in enumerate(imgs):
                  pic=im.copy()
                  pic.thumbnail((width-28,cellheight-38))
                  x=(j%2)*width+(width-pic.width)//2
                  y=(j//2)*cellheight+22
                  m.paste(pic,(x,y))
                  draw.text(((j%2)*width+10,(j//2)*cellheight+7),name+' '+str(j+1),fill='#25372f')
              buf=io.BytesIO();m.save(buf,format='JPEG',quality=70,optimize=True)
              print('MOSAICO_'+name.upper()+'='+base64.b64encode(buf.getvalue()).decode())
          PY
