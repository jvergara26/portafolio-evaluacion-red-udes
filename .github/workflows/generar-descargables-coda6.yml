name: Generar descargables COdA-6
on:
  push:
    paths:
      - .github/workflows/generar-descargables-coda6.yml
      - tools/exportar_presentacion_coda6.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de exportación
        run: |
          python -m pip install --quiet "Pillow>=10" "CairoSVG>=2.7" "python-pptx>=1.0" "reportlab>=4" "pypdf>=5"
      - name: Generar y verificar los 37 contenidos
        run: python tools/exportar_presentacion_coda6.py
      - name: Conservar archivos como artefacto del flujo
        uses: actions/upload-artifact@v4
        with:
          name: coda6-presentacion-final
          path: |
            COdA6_Informe_Implementacion_UDES.pdf
            COdA6_Informe_Implementacion_UDES.pptx
          if-no-files-found: error
          retention-days: 30
      - name: Publicar ambos descargables en el portafolio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COdA6_Informe_Implementacion_UDES.pdf COdA6_Informe_Implementacion_UDES.pptx
          if git diff --cached --quiet; then
            echo "Descargables sin cambios."
          else
            git commit -m "Publicar PDF y PowerPoint finales de las 37 diapositivas COdA-6"
            git push
          fi
