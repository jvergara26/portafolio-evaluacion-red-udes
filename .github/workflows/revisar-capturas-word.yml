name: Revision temporal de capturas del Word UDES
on:
  push:
    paths:
      - .github/workflows/revisar-capturas-word.yml
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer imagenes y construir mosaicos
        run: |
          python -m pip install --quiet Pillow python-docx
          python - <<'PY'
          from docx import Document
          from PIL import Image, ImageDraw
          from io import BytesIO
          import base64
          path='entregas/Documento_Evidencias_Portafolio_UDES.docx'
          doc=Document(path)
          imgs=[]
          for rel in doc.part.rels.values():
              if 'image' in rel.reltype:
                  imgs.append(Image.open(BytesIO(rel.target_part.blob)).convert('RGB'))
          print('DOCX_IMAGENES='+str(len(imgs)))
          for j in range(0,len(imgs),3):
              tri=imgs[j:j+3]
              tile=Image.new('RGB',(750,300*len(tri)),'#e9ecea')
              for k,im in enumerate(tri):
                  im.thumbnail((720,258))
                  x=(750-im.width)//2
                  y=300*k+26
                  tile.paste(im,(x,y))
                  ImageDraw.Draw(tile).text((15,300*k+5),f'Imagen {j+k+1} · {imgs[j+k].size}',fill='#223')
              buf=BytesIO()
              tile.save(buf,format='JPEG',quality=76,optimize=True)
              print('CAPTURAS_MOSAICO_'+str(j//3+1)+'='+base64.b64encode(buf.getvalue()).decode('ascii'))
          PY
