name: Documento de evidencias del portafolio UDES
on:
  push:
    paths:
      - .github/workflows/generar-documento-evidencias.yml
      - tools/crear_documento_evidencias.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas para capturas y documento
        run: |
          python -m pip install --quiet python-docx Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capturar sitio y generar documento Word
        run: python tools/crear_documento_evidencias.py
      - name: Publicar documento como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Documento_Evidencias_Portafolio_UDES
          path: entregas/Documento_Evidencias_Portafolio_UDES.docx
          if-no-files-found: error
          retention-days: 30
      - name: Conservar archivo final en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entregas/Documento_Evidencias_Portafolio_UDES.docx
          if git diff --cached --quiet; then
            echo "Documento sin modificaciones."
          else
            git commit -m "Incorporar documento de evidencias del portafolio para tablero UDES"
            git push
          fi
