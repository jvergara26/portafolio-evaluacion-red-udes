name: Reconstrucción de capturas del portafolio UDES
on:
  push:
    paths:
      - .github/workflows/reconstruir-evidencias-udes.yml
      - tools/crear_evidencias_corregidas.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: |
          python -m pip install --quiet python-docx Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Generar capturas completas por elemento y Word
        run: python tools/crear_evidencias_corregidas.py
      - name: Conservar documento corregido como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Documento-Evidencias-UDES-Corregido
          path: entregas/Documento_Evidencias_Portafolio_UDES_Corregido.docx
          if-no-files-found: error
      - name: Publicar documento corregido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entregas/Documento_Evidencias_Portafolio_UDES_Corregido.docx
          if ! git diff --cached --quiet; then
            git commit -m "Publicar evidencias corregidas con capturas de bloques completos"
            git push
          fi
