name: Verificacion temporal de estilo COdA-6
on:
  push:
    paths:
      - .github/workflows/qa-original-visual.yml
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar las últimas correcciones
        shell: bash
        run: |
          python -m pip -q install CairoSVG Pillow
          python - <<'PY'
          import cairosvg,base64
          from PIL import Image
          from io import BytesIO
          for num in [16,24,25]:
              svg=f'assets/coda6/diapositiva-{num:02}-integrada.svg'
              png=cairosvg.svg2png(url=svg,output_width=1000,output_height=562)
              im=Image.open(BytesIO(png)).convert('RGB')
              buf=BytesIO()
              im.save(buf,format='JPEG',quality=75,optimize=True)
              print(f'RENDER_FINAL_{num:02}='+base64.b64encode(buf.getvalue()).decode('ascii'))
          PY
