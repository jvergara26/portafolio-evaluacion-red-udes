name: Verificacion temporal de estilo COdA-6
on:
  push:
    paths:
      - .github/workflows/qa-original-visual.yml
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Proporcionar imágenes originales para correcciones localizadas
        shell: bash
        run: |
          python - <<'PY'
          import base64
          for i in [10,11,12,16,24,25,27,34,35,37]:
              with open(f'assets/coda6/diapositiva-{i:02}.jpg','rb') as f:
                  b64=base64.b64encode(f.read()).decode('ascii')
                  print(f'ORIGINAL_IMAGE_{i:02}={b64}')
          PY
