name: Verificacion temporal de estilo COdA-6
on:
  push:
    paths:
      - .github/workflows/qa-original-visual.yml
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Muestrear paleta exacta del diseño original
        shell: bash
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from PIL import Image
          for num in (10,11,12,16,24,25,27,34,35,37):
              im=Image.open(f'assets/coda6/diapositiva-{num:02}.jpg').convert('RGB')
              w,h=im.size
              ps=[(.03,.50),(.03,.90),(.09,.41),(.08,.59),(.08,.87),(.18,.52),(.18,.63),(.72,.46),(.72,.60),(.70,.84),(.05,.24)]
              print(f'PALETTE_{num} DIM={w}x{h}='+','.join(f'{x:.2f}_{y:.2f}:{im.getpixel((int(x*w),int(y*h)))}' for x,y in ps))
          PY
