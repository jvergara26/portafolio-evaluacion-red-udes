<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>7. 7. Usabilidad</title><desc>INTEF/GeoGebra: 7. Usabilidad Cuatro indicadores cumplidos, total cinco sobre cinco.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#103129" stroke="none"/>
<rect x="0" y="0" width="1600" height="12" rx="0" fill="#e8ad58" stroke="none"/>
<text x="78" y="62" fill="#e8ad58" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">ANEXO / CODA-6 / MATRIZ ACTUALIZADA</text>
<text x="78" y="133" fill="#f4f1e9" font-family="Georgia,serif" font-size="50" font-weight="400" text-anchor="start">7. 7. Usabilidad</text>
<rect x="78" y="153" width="445" height="4" rx="0" fill="#e8ad58" stroke="none"/>
<text x="80" y="198" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">INTEF/GeoGebra: Explorando la media</text><rect x="80" y="222" width="1438" height="50" rx="5" fill="#1e4b40" stroke="none"/><text x="108" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">CÓD.</text><text x="222" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">INDICADOR CONTEXTUALIZADO</text><text x="930" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">REG.</text><text x="1038" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">EVIDENCIA / OBSERVACIÓN</text><rect x="80" y="275" width="1438" height="126" rx="5" fill="#1e4b40" stroke="none"/><text x="109" y="317" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">7.1.</text><text x="222" y="310" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">El usuario puede identificar cómo iniciar las actividades</text><text x="222" y="337" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">sin instrucciones externas complejas.</text><rect x="921" y="312" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="347" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="310" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">El applet muestra las opciones de «Ver</text><text x="1038" y="337" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">frecuencias», «Ver controles» y «Ver valor</text><text x="1038" y="364" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">de la media» [I3, I7].</text><rect x="80" y="405" width="1438" height="126" rx="5" fill="#173e36" stroke="none"/><text x="109" y="447" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">7.2.</text><text x="222" y="440" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Los controles presentan un funcionamiento comprensible y</text><text x="222" y="467" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">predecible durante la interacción.</text><rect x="921" y="442" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="477" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="440" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Las instrucciones de GeoGebra explican el</text><text x="1038" y="467" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">efecto de cada casilla y punto rojo [I3].</text><rect x="80" y="535" width="1438" height="126" rx="5" fill="#1e4b40" stroke="none"/><text x="109" y="577" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">7.3.</text><text x="222" y="570" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">El recurso permite repetir o reiniciar las actividades</text><text x="222" y="597" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">mediante procedimientos claros y funcionales.</text><rect x="921" y="572" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="607" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="570" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">El reinicio restauró los valores después de</text><text x="1038" y="597" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">modificar frecuencias.</text><rect x="80" y="665" width="1438" height="126" rx="5" fill="#173e36" stroke="none"/><text x="109" y="707" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">7.4.</text><text x="222" y="700" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Los botones, enlaces y controles necesarios para</text><text x="222" y="727" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">desarrollar las actividades funcionan correctamente</text><text x="222" y="754" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">durante las pruebas realizadas.</text><rect x="921" y="702" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="737" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="700" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Casillas, puntos de control, enlaces y</text><text x="1038" y="727" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">reinicio respondieron en prueba manual.</text><rect x="80" y="803" width="1438" height="30" rx="3" fill="#e8ad58" stroke="none"/><text x="98" y="825" fill="#103129" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">RESULTADO: 5/5  ·  Cumple: 4/4  ·  No cumple: 0/4  ·  NV: 0/4</text>
<rect x="78" y="839" width="1444" height="1" rx="0" fill="#456b5e" stroke="none"/>
<text x="80" y="869" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">UDES · John Fernando Vergara Arroyo · Verificación funcional reportada el 21/11/2026</text>
</svg>