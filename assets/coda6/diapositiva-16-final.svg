<text x="80" y="210" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="30" font-weight="400" text-anchor="start">La evaluación no termina en la puntuación.</text><rect x="80" y="279" width="462" height="410" rx="17" fill="#1e4b40" stroke="none"/><rect x="80" y="279" width="462" height="7" rx="3" fill="#e8ad58" stroke="none"/><text x="117" y="362" fill="#e8ad58" font-family="Georgia,serif" font-size="77" font-weight="400" text-anchor="start">01</text><text x="117" y="429" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Cobertura completa</text><text x="117" y="488" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Los diez criterios se puntuaron en</text><text x="117" y="522" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">ambos recursos: PhET 5,00/5 e</text><text x="117" y="556" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">INTEF 4,80/5.</text><rect x="573" y="279" width="462" height="410" rx="17" fill="#1e4b40" stroke="none"/><rect x="573" y="279" width="462" height="7" rx="3" fill="#e8ad58" stroke="none"/><text x="610" y="362" fill="#e8ad58" font-family="Georgia,serif" font-size="77" font-weight="400" text-anchor="start">02</text><text x="610" y="429" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Evidencia trazable</text><text x="610" y="488" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Las comprobaciones técnicas fueron</text><text x="610" y="522" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">reportadas por el evaluador; se</text><text x="610" y="556" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">recomiendan capturas.</text><rect x="1066" y="279" width="462" height="410" rx="17" fill="#1e4b40" stroke="none"/><rect x="1066" y="279" width="462" height="7" rx="3" fill="#e8ad58" stroke="none"/><text x="1103" y="362" fill="#e8ad58" font-family="Georgia,serif" font-size="77" font-weight="400" text-anchor="start">03</text><text x="1103" y="429" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Límites del modelo</text><text x="1103" y="488" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Las puntuaciones describen calidad</text><text x="1103" y="522" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">potencial, no validación</text><text x="1103" y="556" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">estadística ni mejora comprobada</text><text x="1103" y="590" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">del aprendizaje.</text><text x="83" y="753" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">Ver anexos con los 80 indicadores y sus registros actualizados. La nueva prueba de teclado INTEF 8.1</text><text x="83" y="784" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">sustituye el reporte inicial.</text>
