<text x="78" y="133" fill="#f4f1e9" font-family="Georgia,serif" font-size="50" font-weight="400" text-anchor="start">8. 8. Accesibilidad</text>
<rect x="78" y="153" width="445" height="4" rx="0" fill="#e8ad58" stroke="none"/>
<text x="80" y="198" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">INTEF/GeoGebra: Explorando la media</text><rect x="80" y="222" width="1438" height="50" rx="5" fill="#1e4b40" stroke="none"/><text x="108" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">CÓD.</text><text x="222" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">INDICADOR CONTEXTUALIZADO</text><text x="930" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">REG.</text><text x="1038" y="256" fill="#e8ad58" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">EVIDENCIA / OBSERVACIÓN</text><rect x="80" y="275" width="1438" height="126" rx="5" fill="#1e4b40" stroke="none"/><text x="109" y="317" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">8.1.</text><text x="222" y="310" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Las funciones esenciales del recurso pueden utilizarse</text><text x="222" y="337" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">mediante el teclado, sin depender exclusivamente del</text><text x="222" y="364" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">ratón.</text><rect x="921" y="312" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="347" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="310" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">La segunda prueba con teclado fue correcta;</text><text x="1038" y="337" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">sustituye un reporte inicial negativo.</text><rect x="80" y="405" width="1438" height="126" rx="5" fill="#173e36" stroke="none"/><text x="109" y="447" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">8.2.</text><text x="222" y="440" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Los contenidos mantienen su legibilidad cuando se amplía</text><text x="222" y="467" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">la visualización y presentan contraste suficiente entre</text><text x="222" y="494" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">sus elementos.</text><rect x="921" y="442" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="477" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="440" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Ampliación y contraste adecuados, según la</text><text x="1038" y="467" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">comprobación visual del evaluador.</text><rect x="80" y="535" width="1438" height="126" rx="5" fill="#1e4b40" stroke="none"/><text x="109" y="577" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">8.3.</text><text x="222" y="570" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">La información matemática no depende exclusivamente del</text><text x="222" y="597" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">color para comunicar diferencias o resultados.</text><rect x="921" y="572" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="607" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="570" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Barras, posición, etiquetas de ejes y</text><text x="1038" y="597" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">valores numéricos transmiten información</text><text x="1038" y="624" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">además del color [I7].</text><rect x="80" y="665" width="1438" height="126" rx="5" fill="#173e36" stroke="none"/><text x="109" y="707" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">8.4.</text><text x="222" y="700" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Los elementos visuales esenciales cuentan con alternativas</text><text x="222" y="727" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">textuales o información equivalente utilizable mediante</text><text x="222" y="754" fill="#f4f1e9" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">tecnologías de apoyo.</text><rect x="921" y="702" width="60" height="53" rx="9" fill="#e9ede5" stroke="none"/><text x="951" y="737" fill="#173e36" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="1038" y="700" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Nueva prueba: el Narrador comunicó</text><text x="1038" y="727" fill="#c9d9d2" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">información esencial, según el evaluador.</text><rect x="80" y="803" width="1438" height="30" rx="3" fill="#e8ad58" stroke="none"/><text x="98" y="825" fill="#103129" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">RESULTADO: 5/5  ·  Cumple: 4/4  ·  No cumple: 0/4  ·  NV: 0/4</text>
